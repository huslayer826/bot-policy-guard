[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-policy-guard"
version = "0.1.0"
description = "Audit Renovate, Dependabot, and GitHub Actions automation policies for dependency-automation risk."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Bot Policy Guard Maintainers" }]
keywords = ["dependabot", "renovate", "github-actions", "security", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/huslayer826/bot-policy-guard"
Issues = "https://github.com/huslayer826/bot-policy-guard/issues"

[project.scripts]
bot-policy-guard = "bot_policy_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
